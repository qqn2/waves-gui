<text x="612.8" y="38" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">Two-entry elastic buffer absorbs two stalled transfers</text>
<text x="612.8" y="410" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">During a downstream stall, the two entries retain A1 then A2. in_ready drops only after occupancy reaches 2; when ready returns, the output releases the words in order.</text>
