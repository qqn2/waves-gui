<text x="569.6" y="38" fill="#111827" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">Registered-output FIFO returns data after pop</text>
<text x="569.6" y="330" fill="#111827" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">Unlike a show-ahead FIFO, the stored head A5 is loaded into an output register after the accepted pop. dout_valid asserts one registered-output cycle later.</text>
