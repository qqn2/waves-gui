<text x="20" y="256" fill="#111827" font-family="sans-serif" font-weight="400" font-size="12" dominant-baseline="middle" >dout[7:0]</text>
<text x="20" y="296" fill="#111827" font-family="sans-serif" font-weight="400" font-size="12" dominant-baseline="middle" >dout_valid</text>
