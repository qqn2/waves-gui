<text x="468.79999999999995" y="38" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">FIFO occupancy counter adds pushes and subtracts pops</text>
<text x="468.79999999999995" y="370" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">Accepted pushes raise the count and accepted pops lower it. The final simultaneous push and pop cancel, so occupancy holds at 1.</text>
