<text x="836" y="38" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">AXI4-Lite read-clear status register (peripheral policy)</text>
<text x="836" y="666" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">This peripheral policy clears STATUS only on the RVALID/RREADY handshake. RDATA and STATUS remain 0b0101 while RVALID waits, then the register clears after the read completes; AXI4-Lite itself does not mandate read-clear behavior.</text>
