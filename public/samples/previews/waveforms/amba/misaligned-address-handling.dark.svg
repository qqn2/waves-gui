<text x="1008.8" y="558" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">This sample shows one integration policy: an alignment-checking peripheral accepts the handshake then returns SLVERR for an unaligned word access. The address-alignment and error policy must be documented by the interconnect/peripheral; do not infer it from this waveform alone.</text>
