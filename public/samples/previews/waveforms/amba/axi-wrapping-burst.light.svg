<text x="792.8" y="38" fill="#111827" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">AXI WRAP4 read burst: a word-aligned address wraps inside one 16-byte region</text>
<text x="792.8" y="706" fill="#111827" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">This legal WRAP4 burst starts at the word-aligned address 0x10C. Four 4-byte beats occupy a 16-byte wrap region, so the derived addresses are 0x10C, 0x100, 0x104, and 0x108; only the first address is carried on ARADDR.</text>
