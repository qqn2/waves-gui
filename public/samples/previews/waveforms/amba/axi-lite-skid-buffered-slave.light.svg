<text x="1246.3999999999999" y="38" fill="#111827" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">AXI4-Lite slave: one accepted write is held in a skid buffer</text>
<text x="1246.3999999999999" y="826" fill="#111827" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">This trace accepts simultaneous AW and W into one paired skid entry, then deasserts both READY signals while that entry is full. When the register file is ready, the buffered write commits and one B response is returned. A production AXI-Lite slave must preserve the same VALID/payload stability rules for either channel whenever it is stalled.</text>
