<text x="605.6" y="478" fill="#111827" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">Once both write channels are accepted, the slave may assert BVALID. It must keep BVALID and BRESP stable while BREADY is low, then completes on the later B handshake.</text>
