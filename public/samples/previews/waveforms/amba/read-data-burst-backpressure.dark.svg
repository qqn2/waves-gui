<text x="684.8" y="38" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">AXI read burst: RDATA and RLAST hold through R-channel backpressure</text>
<text x="684.8" y="558" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">D0 transfers first. When RREADY drops, D1 is pending: the slave keeps RVALID, RDATA, RRESP, and RLAST unchanged until RREADY returns. D2 then D3 transfer in order, with RLAST=1 only on D3.</text>
