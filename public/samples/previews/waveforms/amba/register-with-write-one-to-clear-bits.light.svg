<text x="623.6" y="638" fill="#111827" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">A W1C register clears only status bits written as one. Writing 0b0101 clears bits 2 and 0, so a prior 0b1111 status becomes 0b1010; zero write bits leave status unchanged.</text>
