<text x="814.4" y="38" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">Invalid AXI4-Lite master: AWVALID drops before an address handshake</text>
<text x="814.4" y="250" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">Deliberately invalid: once the master raises AWVALID, it must keep AWVALID and AWADDR asserted and stable until an AWVALID/AWREADY handshake occurs. Here AWVALID falls before AWREADY ever rises, so no address is transferred.</text>
