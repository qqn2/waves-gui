<text x="724.4" y="746" fill="#111827" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">D0 and D1 transfer first. When WREADY drops, D2 is pending: WVALID, WDATA, WSTRB, and WLAST all remain unchanged until WREADY returns. D3 with WLAST=1 transfers only after that held beat is accepted.</text>
