<text x="634.4" y="478" fill="#111827" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">After a read response becomes valid, the slave must hold RVALID, RDATA, and RRESP stable until the master supplies RREADY. The response is transferred only at that handshake.</text>
