<text x="594.8" y="558" fill="#111827" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">ARLEN=3 requests four read beats. RLAST is low on D0 through D2 and high only with D3, the fourth and final RVALID/RREADY transfer; it is not a separate handshake.</text>
