<text x="558.8" y="38" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">Back-to-back APB transfers to different peripherals</text>
<text x="558.8" y="410" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">After TIMER access completes, PENABLE returns low and the decode changes to PSEL_GPIO for the next setup cycle. The two peripheral selects never overlap.</text>
