<text x="522.8" y="38" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">AXI4-Lite write: AW and W may handshake in the same cycle</text>
<text x="522.8" y="666" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">AW and W are independent AXI4-Lite channels, so both handshakes may occur together. The slave then returns one B response after accepting both.</text>
