<text x="580.4" y="666" fill="#111827" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">The AW payload is held from AWVALID until its handshake. W may arrive later; the write is not complete until both independent channel handshakes have occurred.</text>
