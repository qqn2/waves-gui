<text x="893.6" y="706" fill="#111827" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">This bridge-specific policy accepts AR, waits three downstream cycles without ready, then returns one SLVERR response with a documented default RDATA value. AXI4-Lite defines the response handshake, not a universal timeout length or error policy.</text>
