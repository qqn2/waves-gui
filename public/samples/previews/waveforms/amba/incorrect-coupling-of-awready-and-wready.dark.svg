<text x="1041.2" y="38" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">AXI4-Lite caution: coupled AWREADY and WREADY serialize channels</text>
<text x="1041.2" y="666" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">This coupling is AXI4-Lite legal: a slave may wait for AWVALID, WVALID, or both before asserting either READY. It serializes otherwise independent channel progress, but is not itself a protocol failure. Deadlock occurs only if an invalid master waits for AWREADY before asserting WVALID.</text>
