<text x="508.4" y="38" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">A bridge converts one upstream request into APB SETUP then ACCESS</text>
<text x="508.4" y="598" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">After the bridge accepts the upstream write, it drives PSEL with PENABLE=0 for SETUP, then asserts PENABLE for the completing ACCESS cycle.</text>
