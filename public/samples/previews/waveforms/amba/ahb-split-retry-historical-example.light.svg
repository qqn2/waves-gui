<text x="818" y="38" fill="#111827" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">Historical full-AHB SPLIT / RETRY mechanics (not part of AHB-Lite)</text>
<text x="818" y="598" fill="#111827" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">Historical full AHB only: SPLIT is a two-cycle response (HREADY low then high) that parks M0 until HSPLIT0 re-enables it. RETRY used the same response timing but did not use HSPLIT. Neither SPLIT nor RETRY exists in AHB-Lite.</text>
