<text x="976.4" y="518" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">This is one slave implementation policy: it accepts two AR requests before either response and returns R responses in AR order. AXI4-Lite has no IDs, so it cannot use ID-based out-of-order responses; a simpler slave may instead throttle ARREADY to one outstanding read.</text>
