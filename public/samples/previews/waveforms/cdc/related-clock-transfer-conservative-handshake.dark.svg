<text x="771.1999999999999" y="478" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">The source holds 0xA5 while req traverses to the destination and until ack returns. This costs round-trip latency and control logic, but remains robust when the assumed related-clock timing margin is unavailable.</text>
