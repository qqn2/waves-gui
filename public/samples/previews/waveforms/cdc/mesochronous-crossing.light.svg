<text x="800" y="358" fill="#111827" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">The clocks have the same nominal rate but no guaranteed edge alignment. An elastic buffer or suitable synchronizer absorbs the unknown sampling phase; the fixed offset drawn here is illustrative, not a phase-noise model.</text>
