<text x="620" y="358" fill="#111827" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">A binary count is Gray-encoded before crossing; only one bit changes per increment. The two read-clock synchronizer stages delay the pointer before it is decoded locally.</text>
