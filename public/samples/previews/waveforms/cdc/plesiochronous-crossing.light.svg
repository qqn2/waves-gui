<text x="926" y="358" fill="#111827" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">A small frequency offset makes writes gradually outrun reads, so elastic-buffer occupancy rises. Real designs need depth plus an underflow/overflow or rate-matching policy; the periods and fill labels are conceptual, not a cycle-accurate oscillator model.</text>
