<text x="929.5999999999999" y="426" fill="#e8e8e8" font-size="12" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">Both source bits changed together, but their independently synchronized copies become visible one destination cycle apart. The resulting decode is spurious; transfer an encoded word or use a handshake/FIFO instead (compare the mux-based data synchronizer).</text>
