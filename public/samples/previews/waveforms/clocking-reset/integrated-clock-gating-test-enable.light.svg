<text x="8" y="68" fill="#111827" font-family="sans-serif" font-weight="400" font-size="12" dominant-baseline="middle" >source_clk</text>
<text x="8" y="102" fill="#111827" font-family="sans-serif" font-weight="600" font-size="11" dominant-baseline="middle" >ICG controls</text>
<text x="20" y="136" fill="#111827" font-family="sans-serif" font-weight="400" font-size="12" dominant-baseline="middle" >functional_enable</text>
<text x="20" y="176" fill="#111827" font-family="sans-serif" font-weight="400" font-size="12" dominant-baseline="middle" >scan_enable</text>
<text x="20" y="216" fill="#111827" font-family="sans-serif" font-weight="400" font-size="12" dominant-baseline="middle" >gate_request = functional_enable | scan_enable</text>
<text x="20" y="256" fill="#111827" font-family="sans-serif" font-weight="400" font-size="12" dominant-baseline="middle" >latched_gate_enable</text>
<text x="8" y="296" fill="#111827" font-family="sans-serif" font-weight="400" font-size="12" dominant-baseline="middle" >gated_clk</text>
