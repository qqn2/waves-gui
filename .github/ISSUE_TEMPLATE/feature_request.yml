name: Feature request
description: Propose a focused improvement within the solo-desk editor scope.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Do not include confidential diagrams or proprietary signal names. Backend, accounts, cloud sync, and real-time collaboration are out of scope."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete workflow friction using synthetic examples.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
